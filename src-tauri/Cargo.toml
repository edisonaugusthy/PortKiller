[package]
name = "portkiller"
version = "0.1.0"
description = "A lightweight macOS menu bar port manager"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString"] }

[target."cfg(windows)".dependencies]
netstat2 = "0.11.2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "user"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
