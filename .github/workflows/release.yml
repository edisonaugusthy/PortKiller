name: Release

# Run by hand: Actions › Release › Run workflow, and enter the new version (for example 0.2.0).
# It sets that version in the code, commits it to main, and builds Windows and macOS into a draft
# release "PortKiller <version>" with the installers, the signed update packages and latest.json.
# Leave the version empty to release the version already in the code.
#
# The draft is not public, and installed apps do not see it. Its Mac build is ad-hoc signed; the
# notarized one is built on the maintainer's Mac, and the draft is published only after every
# download in it has been checked the way an installed app reads it:
#   gh release download v<version> --pattern windows-source.txt --dir /tmp
#   git switch --detach "$(cat /tmp/windows-source.txt)"
#   node scripts/release-mac.mjs --upload   # Developer ID build, notarized, replaces the Mac files
#   node scripts/publish-release.mjs        # checks the whole draft, publishes, checks the live feed
# Never publish the draft by hand: 0.3.0 was, with a Mac update package no installed app could unpack.
#
# Website download links always point at the newest release:
#   Windows: https://github.com/edisonaugusthy/PortKiller/releases/latest/download/PortKiller-Windows-Setup.exe
#   macOS:   https://github.com/edisonaugusthy/PortKiller/releases/latest/download/PortKiller-macOS.dmg
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/portkiller-updater.key (signs update packages)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password; leave unset if it has none

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, for example 0.2.0 (empty keeps the current one)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: portkiller-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Recorded as a commit by whoever started the release.
      - name: Set the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin HEAD:main
      - name: Record the Windows build commit
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" > "${RUNNER_TEMP}/windows-source.txt"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PortKiller __VERSION__
          releaseBody: Download PortKiller for your computer below. The app offers this update automatically.
          releaseDraft: true
          releaseCommitish: ${{ steps.source.outputs.sha }}
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
      # A fixed file name, so the website's link always gets the newest installer.
      - name: Add the website download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe PortKiller-Windows-Setup.exe
          gh release upload "v${{ steps.build.outputs.appVersion }}" PortKiller-Windows-Setup.exe "${RUNNER_TEMP}/windows-source.txt" --clobber

  # Ad-hoc signed (signingIdentity "-" in tauri.conf.json): the Developer ID certificate is not on GitHub.
  # scripts/release-mac.mjs replaces this build in the draft with the notarized one before it is published.
  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.windows.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PortKiller __VERSION__
          releaseDraft: true
          releaseCommitish: ${{ needs.windows.outputs.source }}
          includeUpdaterJson: true
          # One app for Apple silicon and Intel Macs.
          args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
      # A fixed file name, so the website's link always gets the newest DMG.
      - name: Check the signature and add the website download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          codesign --verify --deep --strict "$bundle/macos/PortKiller.app"
          codesign -dvv "$bundle/macos/PortKiller.app" 2>&1 | grep -q "Signature=adhoc"
          cp "$bundle"/dmg/*.dmg PortKiller-macOS.dmg
          gh release upload "v${{ steps.build.outputs.appVersion }}" PortKiller-macOS.dmg --clobber
