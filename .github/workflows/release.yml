name: Release

# Run by hand: Actions › Release › Run workflow, and enter the new version (for example 0.2.0).
# It sets that version in the code, commits it to main, and publishes "PortKiller <version>" as a
# GitHub Release with the installer, the signed update package and latest.json. Installed apps read
# latest.json and offer the update. Leave the version empty to release the version already in the code.
#
# Website download links always point at the newest release:
#   Windows: https://github.com/edisonaugusthy/PortKiller/releases/latest/download/PortKiller-Windows-Setup.exe
#   macOS:   https://github.com/edisonaugusthy/PortKiller/releases/latest/download/PortKiller-macOS.dmg  (once the macOS job is enabled)
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/portkiller-updater.key (signs update packages)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password; leave unset if it has none

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, for example 0.2.0 (empty keeps the current one)
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Recorded as a commit by whoever started the release.
      - name: Set the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin HEAD:main
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PortKiller __VERSION__
          releaseBody: Download PortKiller for your computer below. The app offers this update automatically.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
      # A fixed file name, so the website's link always gets the newest installer.
      - name: Add the website download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe PortKiller-Windows-Setup.exe
          gh release upload "v${{ steps.build.outputs.appVersion }}" PortKiller-Windows-Setup.exe --clobber

  # macOS: enable once there is an Apple Developer ID certificate. Unsigned macOS apps are blocked by
  # Gatekeeper, so the DMG is not published until it can be signed and notarized.
  # Extra repository secrets: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
  # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific password) and APPLE_TEAM_ID.
