name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a server on port 3000
        2. Open PortKiller
        3. …
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 26.1, Windows 11 24H2…
  - type: input
    id: version
    attributes:
      label: PortKiller version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here. Please remove anything private, such as folder names.
